apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "orders.labels" . | nindent 4 }}
data:
  APP_MESSAGE: {{ .Values.message | quote }}
  APP_VERSION: {{ include "orders.tag" . | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.database.url | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | quote }}
