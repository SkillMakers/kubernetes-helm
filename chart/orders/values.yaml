# Valeurs par défaut : celles d'un environnement de développement.
# Chaque environnement les surcharge avec son propre fichier (values-prod.yaml) : helm install -f values-prod.yaml.

image:
  repository: orders
  # Vide : on prend appVersion de Chart.yaml. Toujours entre guillemets : 3.10 sans guillemets devient le nombre 3.1.
  tag: ""

# Nombre de copies, ignoré quand l'autoscaling est activé (c'est alors l'autoscaler qui décide).
replicaCount: 1

message: Bonjour

database:
  url: jdbc:postgresql://postgres:5432/orders
  username: app
  # Nom d'un Secret créé hors de Helm, qui contient la clé « password ». Jamais le mot de passe lui-même ici :
  # Helm garde toutes les valeurs de chaque version dans le cluster.
  existingSecret: postgres-db

jvmOptions: -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError

resources:
  requests:
    memory: 384Mi
    cpu: 250m
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
